# Collaboration — backend + frontend in Docker (bind-mount source; packages stay in the container volume).
# Elasticsearch is optional and not started for this lightweight run.
#
# Ports:
#   frontend host 3000 (container 3001) | backend 5000 | postgres 5434 | redis 6381

name: collaboration

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-collab_secret}
      POSTGRES_DB: ${DB_NAME:-selamnew-collab}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - collaboration_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-selamnew-collab}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - collaboration_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: node:20-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./env/backend.env
    environment:
      APP_PORT: 5000
      APP_PUBLIC_BASE_URL: http://localhost:5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-selamnew-collab}
      DB_PASSWORD: ${DB_PASSWORD:-collab_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COLLABORATION_FRONT_URL: http://localhost:3000
    command:
      [
        "sh",
        "-c",
        "if [ ! -d node_modules ]; then echo '==> node_modules missing — npm install'; npm install --no-audit --no-fund --legacy-peer-deps; else echo '==> node_modules present — skip npm install'; fi; npm run start:dev",
      ]
    volumes:
      - ${COLLABORATION_SOURCE}/backend:/app
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:5000/api/v1/spaces',r=>process.exit(r.statusCode>0?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 90s

  frontend:
    image: node:20-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    depends_on:
      backend:
        condition: service_started
    env_file:
      - ./env/frontend.env
    environment:
      NODE_ENV: development
      PORT: 3001
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_COLLABORATION_URL: http://localhost:5000/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:5000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
    command:
      [
        "sh",
        "-c",
        "if [ ! -d node_modules ]; then echo '==> node_modules missing — npm install'; npm install --no-audit --no-fund --legacy-peer-deps; else echo '==> node_modules present — skip npm install'; fi; rm -rf /tmp/next-panic-* /app/.next/dev/cache 2>/dev/null; npx next dev --webpack -H 0.0.0.0 -p 3001",
      ]
    volumes:
      - ${COLLABORATION_SOURCE}/frontend:/app
      - collaboration_frontend_next:/app/.next
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3001/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 120s

  # Browse Docker Postgres tables in a browser (not a host pgAdmin install)
  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    ports:
      - "${ADMINER_HOST_PORT:-8081}:8080"

volumes:
  collaboration_pgdata:
  collaboration_redis:
  collaboration_frontend_next:
