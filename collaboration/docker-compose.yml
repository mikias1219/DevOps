# Collaboration stack — images for frontend/backend, named volumes for data.
# Infra services (db/redis/elasticsearch) keep existing volume names so a
# recreate of FE/BE does not wipe data.
#
# Ports:
#   frontend host 3000 (container 3001) | backend 5000 | postgres 5434 | redis 6381 | ES 9200

name: collaboration

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-collab_secret}
      POSTGRES_DB: ${DB_NAME:-selamnew-collab}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - collaboration_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-selamnew-collab}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    volumes:
      - collaboration_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: collaboration-dev
    ports:
      - "127.0.0.1:${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - collaboration_esdata:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  backend:
    image: ${REGISTRY:-127.0.0.1:5001}/collaboration-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - ./env/backend.env
    environment:
      APP_PORT: "5000"
      APP_PUBLIC_BASE_URL: http://172.16.50.39:5000
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-selamnew-collab}
      DB_PASSWORD: ${DB_PASSWORD:-collab_secret}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ""
      ELASTICSEARCH_PASSWORD: ""
      COLLABORATION_FRONT_URL: http://172.16.50.39:3000
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:5000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 40s

  frontend:
    image: ${REGISTRY:-127.0.0.1:5001}/collaboration-frontend:${FRONTEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    env_file:
      - ./env/frontend.env
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3001/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 40s

  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha
    ports:
      - "${ADMINER_HOST_PORT:-8081}:8080"

volumes:
  collaboration_pgdata:
  collaboration_redis:
  collaboration_esdata:
