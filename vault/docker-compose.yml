# Vault — file storage + UI (not -dev)
# Start: docker compose -f vault/docker-compose.yml up -d && ./vault/scripts/unseal.sh
# First time: ./vault/scripts/bootstrap.sh

name: vault

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: selamnew-vault
    restart: unless-stopped
    # Skip docker-entrypoint.sh setcap race (binds :8200 twice on this host).
    user: vault
    entrypoint: ["vault"]
    command: ["server", "-config=/vault/config/vault.hcl"]
    ports:
      - "0.0.0.0:8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./config/vault.hcl:/vault/config/vault.hcl:ro
      - vault_data:/vault/file
      - ./secrets:/vault/secrets:ro

volumes:
  vault_data:
