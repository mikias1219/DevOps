# Vault — file storage + UI (not -dev)
# Start: docker compose -f vault/docker-compose.yml up -d
# First time: ./vault/scripts/bootstrap.sh
# After recreate: ./vault/scripts/unseal.sh (or cron)

name: vault

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: selamnew-vault
    restart: unless-stopped
    ports:
      - "0.0.0.0:8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./config/vault.hcl:/vault/config/vault.hcl:ro
      - vault_data:/vault/file
      - ./secrets:/vault/secrets:ro
    entrypoint: ["vault"]
    command: ["server", "-config=/vault/config/vault.hcl"]

volumes:
  vault_data:
