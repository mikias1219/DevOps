# Nginx helpers for DevOps webhooks + Secrets Room.
#
# Vault UI (secret store):     http://SERVER_IP:8200/ui
# Secrets Room (env apply):    http://SERVER_IP:8300/  or  http://SERVER_IP/secrets/
#
# Enable this file (or merge locations into the existing :80 site):
#   sudo cp nginx/selamnew-vault-secrets.conf /etc/nginx/sites-available/selamnew-devops-webhooks
#   sudo ln -sf ../sites-available/selamnew-devops-webhooks /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream jenkins_webhook {
    server 127.0.0.1:8080;
    keepalive 8;
}

# If port 80 is already claimed by another default_server, copy only the
# location blocks below into that server { } instead of enabling this whole file.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /generic-webhook-trigger/ {
        proxy_pass http://jenkins_webhook/generic-webhook-trigger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header Content-Type $content_type;
    }

    location /github-webhook/ {
        proxy_pass http://jenkins_webhook/github-webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
    }

    # Secrets Room — compare Vault KV ↔ env files, apply via Jenkins
    location /secrets/ {
        proxy_pass http://127.0.0.1:8300/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /secrets {
        return 302 /secrets/;
    }
}
