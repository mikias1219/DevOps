# Nginx helpers for DevOps webhooks (Vault/Secrets Room use Docker ports directly).
#
# Vault UI:        http://SERVER_IP:8200/ui   (docker compose vault)
# Secrets Room:    http://SERVER_IP:8300/     (docker compose secrets-room)
#
# Merge the /generic-webhook-trigger/ location into your :80 server block, or
# enable this file if it does not conflict with an existing default_server.

upstream jenkins_webhook {
    server 127.0.0.1:8080;
    keepalive 8;
}

# If port 80 is already claimed by selamnew-collab, copy only the location
# blocks below into that server { } instead of enabling this whole file.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /generic-webhook-trigger/ {
        proxy_pass http://jenkins_webhook/generic-webhook-trigger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header Content-Type $content_type;
    }

    location /github-webhook/ {
        proxy_pass http://jenkins_webhook/github-webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
    }
}
