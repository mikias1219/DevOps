# Selamnew Collaboration lab — nginx :80 front door (test + staging + production tiers)
#
# TEST (develop):
#   http://SERVER/                      → FE :3000
#   http://SERVER/api/                  → BE :5000
#   http://SERVER/notification/         → NES :8006
#
# STAGING (branch staging):
#   http://SERVER/staging/              → FE :3010
#   http://SERVER/staging/api/          → BE :5010
#   http://SERVER/staging/notification/ → NES :8016
#
# PRODUCTION (branch production):
#   http://SERVER/production/           → FE :3020
#   http://SERVER/production/api/       → BE :5020
#   http://SERVER/production/notification/ → NES :8026
#
# Jenkins GWT: /generic-webhook-trigger/

upstream jenkins_webhook {
    server 127.0.0.1:8080;
    keepalive 8;
}

upstream collab_frontend_test {
    server 127.0.0.1:3000;
    keepalive 8;
}

upstream collab_backend_test {
    server 127.0.0.1:5000;
    keepalive 8;
}

upstream collab_notification_test {
    server 127.0.0.1:8006;
    keepalive 8;
}

upstream collab_frontend_staging {
    server 127.0.0.1:3010;
    keepalive 8;
}

upstream collab_backend_staging {
    server 127.0.0.1:5010;
    keepalive 8;
}

upstream collab_notification_staging {
    server 127.0.0.1:8016;
    keepalive 8;
}

upstream collab_frontend_production {
    server 127.0.0.1:3020;
    keepalive 8;
}

upstream collab_backend_production {
    server 127.0.0.1:5020;
    keepalive 8;
}

upstream collab_notification_production {
    server 127.0.0.1:8026;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 172.16.50.39 _;

    client_max_body_size 100m;

    location /generic-webhook-trigger/ {
        proxy_pass http://jenkins_webhook/generic-webhook-trigger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 90s;
    }

    location /github-webhook/ {
        proxy_pass http://jenkins_webhook/github-webhook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- PRODUCTION tier (longest prefix first among tiers) ---
    location /production/notification/ {
        proxy_pass http://collab_notification_production/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /production/api/ {
        proxy_pass http://collab_backend_production/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /production/docs {
        proxy_pass http://collab_backend_production/docs;
        proxy_set_header Host $host;
    }

    location /production/socket.io/ {
        proxy_pass http://collab_backend_production/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /production/ {
        proxy_pass http://collab_frontend_production/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /production {
        return 302 /production/;
    }

    # --- STAGING tier ---
    location /staging/notification/ {
        proxy_pass http://collab_notification_staging/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /staging/api/ {
        proxy_pass http://collab_backend_staging/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /staging/docs {
        proxy_pass http://collab_backend_staging/docs;
        proxy_set_header Host $host;
    }

    location /staging/socket.io/ {
        proxy_pass http://collab_backend_staging/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /staging/ {
        proxy_pass http://collab_frontend_staging/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /staging {
        return 302 /staging/;
    }

    # --- TEST tier (develop) ---
    location /notification/ {
        proxy_pass http://collab_notification_test/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /notification {
        return 302 /notification/;
    }

    location /api/ {
        proxy_pass http://collab_backend_test/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /docs {
        proxy_pass http://collab_backend_test/docs;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass http://collab_backend_test/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://collab_frontend_test;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
