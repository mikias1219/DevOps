# Selamnew Collaboration lab — single nginx front door on :80
#
# Apps (path-based):
#   http://SERVER_IP/                 → frontend :3000
#   http://SERVER_IP/api/ … /docs …   → backend  :5000
#   http://SERVER_IP/notification/    → NES      :8006
#   http://SERVER_IP/generic-webhook-trigger/ → Jenkins GWT
#
# Management UIs stay on dedicated ports (not subpaths):
#   Jenkins  http://SERVER_IP:8080
#   Vault UI http://SERVER_IP:8200/ui
#   Portainer https://SERVER_IP:9443
#
# Install:
#   sudo cp nginx/selamnew-collab.conf /etc/nginx/sites-available/selamnew-collab
#   sudo ln -sfn /etc/nginx/sites-available/selamnew-collab /etc/nginx/sites-enabled/selamnew-collab
#   sudo rm -f /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/selamnew-devops-webhooks
#   sudo nginx -t && sudo systemctl reload nginx

upstream jenkins_webhook {
    server 127.0.0.1:8080;
    keepalive 8;
}

upstream collab_frontend {
    server 127.0.0.1:3000;
    keepalive 8;
}

upstream collab_backend {
    server 127.0.0.1:5000;
    keepalive 8;
}

upstream collab_notification {
    server 127.0.0.1:8006;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 172.16.50.39 _;

    client_max_body_size 100m;

    # --- GitHub → Jenkins (Generic Webhook Trigger) ---
    location /generic-webhook-trigger/ {
        proxy_pass http://jenkins_webhook/generic-webhook-trigger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header Content-Type $content_type;
        proxy_read_timeout 90s;
    }

    location /github-webhook/ {
        proxy_pass http://jenkins_webhook/github-webhook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
    }

    # --- Notification service (strip /notification prefix) ---
    location /notification/ {
        proxy_pass http://collab_notification/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /notification {
        return 302 /notification/;
    }

    # --- Backend API + docs + Socket.IO ---
    location /api/ {
        proxy_pass http://collab_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /docs {
        proxy_pass http://collab_backend/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://collab_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # --- Frontend (Next.js) — catch-all last ---
    location / {
        proxy_pass http://collab_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
