# Notification-and-email-service stack — lab only (docker-devops owned).
# App source is read-only under COLLABORATION_SOURCE/Notification-and-email-service.

name: notification

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-nes_secret}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-selamnew-notification}
    ports:
      - "${NOTIFICATION_POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - notification_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${NOTIFICATION_DB_USER:-postgres} -d ${NOTIFICATION_DB_NAME:-selamnew-notification}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  notification:
    image: ${REGISTRY:-127.0.0.1:5001}/collaboration-notification:${NOTIFICATION_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./env/notification.env
    environment:
      APP_PORT: "8006"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${NOTIFICATION_DB_USER:-postgres}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-nes_secret}
      DB_NAME: ${NOTIFICATION_DB_NAME:-selamnew-notification}
      DB_TYPE: postgres
      DB_SYNCHRONIZE_ENTITIES: "true"
      FILE_SERVER_URL: ${FILE_SERVER_URL:-http://172.16.50.39:5000}
      PRODUCT: ${PRODUCT:-COLLAB}
      SOURCE_SERVICE: ${SOURCE_SERVICE:-collaboration}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-nes_secret}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-selamnew-notification}
    ports:
      - "${NOTIFICATION_HOST_PORT:-8006}:8006"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:8006/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 40s

  adminer:
    image: adminer:4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${NOTIFICATION_ADMINER_HOST_PORT:-8084}:8080"

volumes:
  notification_pgdata:
