# Jenkins for DevOps learning — builds Housekeeper + Collaboration via host Docker
# Usage:
#   cp ../.env.example ../.env   (set DOCKER_GID)
#   docker compose up -d --build

name: jenkins

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-jenkins:local
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: "-Dhudson.lifecycle=hudson.lifecycle.ExitLifecycle"
    group_add:
      - "${DOCKER_GID:-124}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/var/devops:rw
      - ./init.groovy.d:/usr/share/jenkins/ref/init.groovy.d:ro
      - /home/mikias/workspace/company/SelamnewCollaboration:/home/mikias/workspace/company/SelamnewCollaboration:rw
      - "/home/mikias/workspace/personal/my personal project/lifeos:/home/mikias/workspace/personal/my personal project/lifeos:rw"
      - /home/mikias/.ssh:/var/jenkins_home/.ssh-host:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 60s

  # Quiet GitHub SHA checker. Triggers Jenkins watch-github only when a branch moves.
  github-watch:
    image: devops-jenkins:local
    user: jenkins
    restart: unless-stopped
    depends_on:
      jenkins:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/var/devops/jenkins/watch-github-loop.sh"]
    environment:
      JENKINS_URL: http://jenkins:8080
      WATCH_INTERVAL_SECONDS: "30"
    volumes:
      - ..:/var/devops:rw
      - /home/mikias/workspace/company/SelamnewCollaboration:/home/mikias/workspace/company/SelamnewCollaboration:ro
      - "/home/mikias/workspace/personal/my personal project/lifeos:/home/mikias/workspace/personal/my personal project/lifeos:ro"
      - /home/mikias/.ssh:/var/jenkins_home/.ssh-host:ro

volumes:
  jenkins_home:
