# Jenkins for DevOps learning — builds Housekeeper + Collaboration via host Docker
# Usage:
#   cp ../.env.example ../.env   (set DOCKER_GID)
#   docker compose up -d --build

name: jenkins

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-jenkins:local
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    env_file:
      - ./secrets/admin.env
    environment:
      JAVA_OPTS: "-Dhudson.lifecycle=hudson.lifecycle.ExitLifecycle"
    group_add:
      - "${DOCKER_GID:-124}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/var/devops:rw
      - ./init.groovy.d:/usr/share/jenkins/ref/init.groovy.d:ro
      - /home/mikias/workspace/company/SelamnewCollaboration:/home/mikias/workspace/company/SelamnewCollaboration:rw
      - "/home/mikias/workspace/personal/my personal project/lifeos:/home/mikias/workspace/personal/my personal project/lifeos:rw"
      - /home/mikias/.ssh:/var/jenkins_home/.ssh-host:ro
      - ./secrets:/var/devops/jenkins/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 60s

  # github-watch disabled until GitHub webhook is implemented.
  # Use Jenkins job pull-collaboration-now for manual pulls from develop.
  # github-watch:
  #   image: devops-jenkins:local
  #   ...

volumes:
  jenkins_home:
